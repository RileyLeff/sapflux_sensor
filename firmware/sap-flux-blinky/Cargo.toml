[package]
name = "sap-flux-blinky"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-cortex-m"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = [
  "memory-x",
  "stm32g0b1cb",
  "time",
] }
# Time base: LPTIM1 on the 32.768 kHz LSE through our own driver
# (src/timebase.rs); embassy-stm32 0.6's time-driver-lptim1 does not build
# for STM32G0.
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-time-driver = "0.2.2"
embassy-time-queue-utils = "0.3.2"
critical-section = "1.2.0"
heapless = "0.9.3"
panic-halt = "1.0.0"
stm32-metapac = { version = "21.0.0", features = ["stm32g0b1cb"] }
embedded-hal-nb = "1.0.0"
nb = "1.1.0"
sap-flux-core = { path = "../sap-flux-core" }
sap-flux-protocol = { path = "../../software/sap-flux-protocol" }
static_cell = "2.1.1"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }

# The SFK1 encoders (two profiles, generic code instantiated in
# sap-flux-core) add 24 kB of text at opt-level 3, leaving under 4 kB of the
# 128 kB flash; at "s" they add about 11 kB.
[profile.release.package.sfk1]
opt-level = "s"

[profile.release.package.sap-flux-core]
opt-level = "s"
