[package]
name = "sapflux-server"
description = "UDP ingest server, admin API/CLI and gateway simulator for the sap-flux field deployment"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sapflux-uplink = { path = "../sapflux-uplink", features = ["std"] }
sap-flux-protocol = { path = "../../software/sap-flux-protocol" }
sfk1 = { path = "../../software/sfk1", features = ["std", "serde"] }
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "macros", "time", "signal", "sync"] }
axum = "0.8.9"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
