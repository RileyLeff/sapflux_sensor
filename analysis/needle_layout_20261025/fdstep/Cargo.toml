[package]
name = "fdstep"
version = "0.1.0"
edition = "2021"
description = "Crank-Nicolson time loop for the needle_layout FD slices (operators assembled in fd2d.py)"

[dependencies]
faer = { version = "0.22", default-features = false, features = ["std", "linalg", "sparse"] }
rayon = "1.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
